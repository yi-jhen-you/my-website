<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>標準工程施工流程圖產生器</title>
  <style>
    /* 網頁 UI 維持微軟正黑體 */
    * { box-sizing: border-box; font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 24px; background-color: #f1f5f9; color: #0f172a; font-size: 15px; }
    
    .app-header { max-width: 1560px; margin: 0 auto 18px auto; display: flex; justify-content: space-between; align-items: center; }
    .app-title { font-size: 1.35rem; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 10px; }
    .badge { font-size: 0.8rem; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-phase { background: #e0e7ff; color: #3730a3; }

    /* 左右雙欄 1:1 佈局 */
    .layout-container { max-width: 1560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .card { background: #ffffff; border-radius: 10px; border: 1px solid #cbd5e1; box-shadow: 0 2px 5px rgba(0,0,0,0.04); padding: 22px; }
    .card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; min-height: 36px; }

    /* 參數微調工具列面板 (加大組件間距，防止誤觸) */
    .adjust-toolbar { display: flex; flex-wrap: wrap; gap: 16px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 9px 14px; margin-bottom: 14px; }
    .stepper-item { display: flex; align-items: center; background: #fff; border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 3px 8px; gap: 6px; }
    .stepper-label { font-size: 0.84rem; font-weight: 700; color: #475569; margin-right: 2px; }
    .btn-step { width: 24px; height: 24px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; color: #334155; transition: all 0.2s; user-select: none; }
    .btn-step:hover { background: #e2e8f0; color: #0f172a; border-color: #94a3b8; }
    .btn-step:active { transform: scale(0.92); }
    .step-value { font-size: 0.86rem; font-weight: 700; min-width: 36px; text-align: center; color: #1e293b; }

    /* 頂部開關控制列 */
    .top-controls { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .switch-label { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; cursor: pointer; color: #1e293b; }

    /* 階段分組區塊樣式 */
    .phase-section { border: 1.5px solid #cbd5e1; border-radius: 8px; margin-bottom: 14px; overflow: hidden; background: #fff; }
    .phase-header { padding: 8px 12px; font-weight: 700; font-size: 0.92rem; display: flex; justify-content: space-between; align-items: center; }
    .phase-pre .phase-header { background: #eff6ff; color: #1d4ed8; border-bottom: 1.5px solid #bfdbfe; }
    .phase-mid .phase-header { background: #fefce8; color: #a16207; border-bottom: 1.5px solid #fef08a; }
    .phase-post .phase-header { background: #f0fdf4; color: #15803d; border-bottom: 1.5px solid #bbf7d0; }
    
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
    th { background: #f8fafc; color: #334155; font-weight: 700; padding: 8px 6px; border-bottom: 1.5px solid #cbd5e1; white-space: nowrap; font-size: 0.88rem; }
    td { padding: 6px 6px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
    
    .col-drag { width: 34px; text-align: center; }
    .col-seq { width: 40px; text-align: center; font-weight: 700; color: #475569; }
    .col-check { width: 85px; text-align: center; }
    .col-phase { width: 95px; text-align: center; }
    .col-break { width: 95px; text-align: center; }
    .col-action { width: 44px; text-align: center; }

    .drag-handle { cursor: grab; color: #94a3b8; font-size: 1.2rem; user-select: none; display: inline-block; padding: 2px 4px; border-radius: 4px; }
    .drag-handle:hover { color: #1e293b; background: #e2e8f0; }
    .drag-handle:active { cursor: grabbing; }
    tr.dragging { opacity: 0.35; background: #e2e8f0; }

    /* 上/下半部藍線放置指示 */
    tr.drag-over-top > td { border-top: 3px solid #2563eb !important; }
    tr.drag-over-bottom > td { border-bottom: 3px solid #2563eb !important; }
    tbody.tbody-drag-over { background-color: #f0fdf4; outline: 2px dashed #2563eb; outline-offset: -2px; }

    .btn-break { padding: 3px 6px; font-size: 0.78rem; border-radius: 4px; border: 1.5px solid #cbd5e1; background: #fff; color: #475569; cursor: pointer; font-weight: 600; transition: all 0.2s; white-space: nowrap; }
    .btn-break:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
    .btn-break.active { background: #2563eb; color: #fff; border-color: #1d4ed8; }

    select.phase-select { padding: 4px 6px; border: 1.5px solid #cbd5e1; border-radius: 4px; font-size: 0.85rem; background: #fff; outline: none; cursor: pointer; }
    input[type="text"], textarea { width: 100%; padding: 7px 8px; border: 1.5px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; font-family: "Microsoft JhengHei", sans-serif; }
    input[type="text"]:focus, textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #2563eb; vertical-align: middle; }

    .btn-icon { background: none; border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 4px 7px; cursor: pointer; font-size: 0.85rem; color: #475569; font-weight: bold; }
    .btn-delete:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }

    /* 表單設定面板 */
    .forms-panel { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; }
    .forms-panel-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 10px; color: #334155; }
    .forms-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; }
    .form-group textarea { font-size: 0.9rem; resize: vertical; height: 50px; line-height: 1.35; }

    /* 操作按鈕群 */
    .action-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .btn { padding: 10px 18px; border-radius: 8px; font-size: 0.92rem; font-weight: 700; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-outline { background: #fff; border: 1.5px solid #cbd5e1; color: #334155; }
    .btn-outline:hover { background: #f8fafc; border-color: #94a3b8; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #059669; color: #fff; }
    .btn-success:hover { background: #047857; }
    .btn-paste { background: #4f46e5; color: #fff; }
    .btn-paste:hover { background: #4338ca; }

    /* 右側即時預覽畫布 */
    .preview-sticky { position: sticky; top: 20px; }
    .preview-canvas { background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 24px 16px; display: flex; justify-content: center; min-height: 640px; overflow-y: auto; max-height: 86vh; }
    svg { overflow: visible; }
    .status-toast { font-size: 0.92rem; font-weight: 700; margin-top: 10px; min-height: 22px; }

    /* 貼上彈窗 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-box { background: #fff; border-radius: 10px; width: 580px; max-width: 95%; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); }
    .modal-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 10px; color: #0f172a; }
    .paste-area { width: 100%; height: 160px; padding: 12px; border: 2px dashed #94a3b8; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; resize: none; margin-bottom: 14px; outline: none; }
    .paste-area:focus { border-color: #2563eb; background: #f8fafc; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

    .footer-credit { text-align: center; margin-top: 40px; margin-bottom: 20px; color: #94a3b8; font-size: 0.9rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: 1px; }
  </style>
</head>
<body>

<div class="app-header">
  <div class="app-title">
    工程標準流程圖產生器
    <span class="badge badge-blue">★ 查驗停留點</span>
    <span class="badge badge-red">※ 安衛查驗點</span>
    <span class="badge badge-phase">施工階段管制</span>
  </div>
</div>

<div class="layout-container">
  <!-- 左側：編輯區 -->
  <div class="card">
    <div class="card-title">
      <span>流程項目編輯表</span>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-paste" style="font-size:0.8rem; padding:5px 10px;" onclick="openPasteModal()">📋 貼上 Word 流程欄位</button>
        <button class="btn btn-outline" style="font-size:0.8rem; padding:5px 10px;" onclick="resetDemo()">預設範例</button>
      </div>
    </div>

    <!-- 階段開關控制 -->
    <div class="top-controls">
      <label class="switch-label">
        <input type="checkbox" id="enablePhasesCheckbox" checked onchange="toggleEnablePhases(this.checked)">
        <span>啟用施工階段管制（施工前／中／後）</span>
      </label>
      <small id="dualColNotice" style="color:#d97706; font-weight:bold; display:none;">⚠️ 雙排排版中：已自動取消勾選施工管制</small>
    </div>

    <!-- 方案 C：三段分組容器 -->
    <div id="sectionsContainer"></div>

    <!-- 使用表單設定面板 (預設空白) -->
    <div class="forms-panel">
      <div class="forms-panel-title">📝 流程圖「使用表單」名稱設定 (單排時置右 / 雙排時置底)</div>
      <div class="forms-grid">
        <div class="form-group">
          <label style="color:#0033CC;">施工抽查紀錄表（藍色字體）：</label>
          <textarea id="blueFormsInput" placeholder="例如：表 02742-01 瀝青混凝土鋪面施工抽查紀錄表" oninput="updateDiagram()"></textarea>
        </div>
        <div class="form-group">
          <label style="color:#CC0000;">安衛查驗表單（紅色字體）：</label>
          <textarea id="redFormsInput" placeholder="例如：表 02742-02 瀝青混凝土施工安全監造現場抽查表" oninput="updateDiagram()"></textarea>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn btn-primary" onclick="copyVmlToClipboard()">複製原生圖形 (貼上 Word)</button>
      <button class="btn btn-success" onclick="downloadWordDoc()">下載 .doc 檔案</button>
    </div>
    <div id="statusToast" class="status-toast"></div>
  </div>

  <!-- 右側：即時預覽區 -->
  <div class="card preview-sticky">
    <div class="card-title">
      <span id="previewSubTitle" style="color:#334155; font-weight:700;">施工階段管制模式 (施工前/中/後)</span>
    </div>

    <!-- 參數微調工具列 (按鈕間隔拉大) -->
    <div class="adjust-toolbar">
      <div class="stepper-item">
        <span class="stepper-label">寬度</span>
        <button class="btn-step" onclick="adjustParam('width', -10)">－</button>
        <span class="step-value" id="valWidth">150pt</span>
        <button class="btn-step" onclick="adjustParam('width', 10)">＋</button>
      </div>
      <div class="stepper-item">
        <span class="stepper-label">高度</span>
        <button class="btn-step" onclick="adjustParam('height', -2)">－</button>
        <span class="step-value" id="valHeight">38pt</span>
        <button class="btn-step" onclick="adjustParam('height', 2)">＋</button>
      </div>
      <div class="stepper-item">
        <span class="stepper-label">字體</span>
        <button class="btn-step" onclick="adjustParam('font', -1)">－</button>
        <span class="step-value" id="valFont">10pt</span>
        <button class="btn-step" onclick="adjustParam('font', 1)">＋</button>
      </div>
      <div class="stepper-item">
        <span class="stepper-label">箭頭</span>
        <button class="btn-step" onclick="adjustParam('gap', -2)">－</button>
        <span class="step-value" id="valGap">28pt</span>
        <button class="btn-step" onclick="adjustParam('gap', 2)">＋</button>
      </div>
    </div>

    <div class="preview-canvas" id="canvasWrapper">
      <svg id="svgPreview" width="580"></svg>
    </div>
  </div>
</div>

<div class="footer-credit">design by jhen</div>

<!-- 貼上對話框 -->
<div class="modal-overlay" id="pasteModal">
  <div class="modal-box">
    <div class="modal-title">📋 批次貼上 Word 施工流程欄位</div>
    <p style="font-size:0.88rem; color:#64748b; margin-top:0;">在 Word 選取整欄流程文字按 <code>Ctrl+C</code>，點入下方框中按 <code>Ctrl+V</code> 貼上（新項目將預設歸入「施工中」）：</p>
    <textarea id="modalPasteInput" class="paste-area" placeholder="請在此處按 Ctrl+V 貼上...&#10;系統會自動識別「開始」、「完成」、「※」與「★」符號！"></textarea>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closePasteModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmModalPaste()">解析並匯入流程圖</button>
    </div>
  </div>
</div>

<script>
  let flowData = [
    { id: 1, text: "施工前準備工作", isStopPoint: true, isSafetyPoint: true, phase: 'pre' },
    { id: 2, text: "防水膜作業", isStopPoint: true, isSafetyPoint: true, phase: 'mid' },
    { id: 3, text: "清理及檢視", isStopPoint: true, isSafetyPoint: true, phase: 'post' }
  ];

  let enablePhases = true;
  let splitAfterIndex = null;

  // 四大排版動態參數
  let nodeWidth = 150;              // 圖塊寬度 (pt)
  let nodeHeight = 38;              // 基礎作業圖塊高度 (pt)
  let fontSizePt = 10;              // 字體大小 (pt)
  let verticalGap = 28;             // 箭頭長度 (pt)
  const PASS_VERTICAL_GAP = 28;     // 查驗停留點「合格」箭頭固定保護間距

  const startNodeText = "開始";
  const endNodeText = "完成";
  const START_END_HEIGHT = 45;      // 開始與完成高度固定卡死 45pt
  const CIRCLE_RADIUS = 10;         // 正圓形接續點縮減 1/4 (直徑 20pt)

  let draggedItemId = null;

  window.onload = () => {
    renderSections();
    updateDiagram();
    bindGlobalPaste();
  };

  function resetDemo() {
    flowData = [
      { id: 1, text: "施工前準備工作", isStopPoint: true, isSafetyPoint: true, phase: 'pre' },
      { id: 2, text: "防水膜作業", isStopPoint: true, isSafetyPoint: true, phase: 'mid' },
      { id: 3, text: "清理及檢視", isStopPoint: true, isSafetyPoint: true, phase: 'post' }
    ];
    enablePhases = true;
    splitAfterIndex = null;
    nodeWidth = 150;
    nodeHeight = 38;
    fontSizePt = 10;
    verticalGap = 28;
    updateStepperDisplay();
    // 使用表單預設空白
    document.getElementById('blueFormsInput').value = "";
    document.getElementById('redFormsInput').value = "";
    renderSections();
    updateDiagram();
  }

  function adjustParam(type, delta) {
    if (type === 'width') {
      nodeWidth = Math.max(110, Math.min(240, nodeWidth + delta));
    } else if (type === 'height') {
      nodeHeight = Math.max(28, Math.min(64, nodeHeight + delta));
    } else if (type === 'font') {
      fontSizePt = Math.max(8, Math.min(16, fontSizePt + delta));
    } else if (type === 'gap') {
      verticalGap = Math.max(14, Math.min(50, verticalGap + delta));
    }
    updateStepperDisplay();
    updateDiagram();
  }

  function updateStepperDisplay() {
    document.getElementById('valWidth').textContent = nodeWidth + 'pt';
    document.getElementById('valHeight').textContent = nodeHeight + 'pt';
    document.getElementById('valFont').textContent = fontSizePt + 'pt';
    document.getElementById('valGap').textContent = verticalGap + 'pt';
  }

  function toggleEnablePhases(checked) {
    enablePhases = checked;
    if (enablePhases) {
      splitAfterIndex = null;
    }
    renderSections();
    updateDiagram();
  }

  function getSortedFlowData() {
    if (!enablePhases) return flowData;
    const phaseWeights = { 'pre': 1, 'mid': 2, 'post': 3 };
    return [...flowData].sort((a, b) => {
      const wA = phaseWeights[a.phase || 'mid'] || 2;
      const wB = phaseWeights[b.phase || 'mid'] || 2;
      if (wA !== wB) return wA - wB;
      return flowData.indexOf(a) - flowData.indexOf(b);
    });
  }

  function formatNodeLines(text) {
    if (!text) return [""];
    const maxCharsPerLine = Math.max(6, Math.floor(nodeWidth / 15));
    const sections = text.split(/\r?\n/);
    const resultLines = [];

    sections.forEach(sec => {
      let remaining = sec.trim();
      if (remaining.length <= maxCharsPerLine) {
        resultLines.push(remaining);
      } else {
        while (remaining.length > maxCharsPerLine) {
          let cutIdx = -1;
          for (let i = maxCharsPerLine; i >= 4; i--) {
            if (['、', '，', ',', ' ', '/', '及', '與'].includes(remaining[i])) {
              cutIdx = i + 1;
              break;
            }
          }
          if (cutIdx === -1) cutIdx = maxCharsPerLine;
          resultLines.push(remaining.substring(0, cutIdx).trim());
          remaining = remaining.substring(cutIdx).trim();
        }
        if (remaining.length > 0) resultLines.push(remaining);
      }
    });
    return resultLines;
  }

  function renderSections() {
    const container = document.getElementById('sectionsContainer');
    container.innerHTML = '';

    const chk = document.getElementById('enablePhasesCheckbox');
    if (chk) chk.checked = enablePhases;

    const sorted = getSortedFlowData();
    const isDualColActive = (splitAfterIndex !== null && splitAfterIndex < sorted.length - 1);
    document.getElementById('dualColNotice').style.display = isDualColActive ? 'inline' : 'none';

    const groups = enablePhases ? [
      { key: 'pre', name: '【施工前作業】', class: 'phase-pre' },
      { key: 'mid', name: '【施工中作業】', class: 'phase-mid' },
      { key: 'post', name: '【施工後作業】', class: 'phase-post' }
    ] : [
      { key: 'all', name: '【工作流程項目】', class: 'phase-mid' }
    ];

    groups.forEach((grp) => {
      const itemsInGroup = enablePhases 
        ? sorted.filter(item => (item.phase || 'mid') === grp.key)
        : sorted;

      const secDiv = document.createElement('div');
      secDiv.className = `phase-section ${grp.class}`;

      secDiv.innerHTML = `
        <div class="phase-header">
          <span>${grp.name} (${itemsInGroup.length} 項)</span>
          <button class="btn btn-outline" style="font-size:0.78rem; padding:3px 8px;" onclick="addNewRow('${grp.key === 'all' ? 'mid' : grp.key}')">＋ 新增工項</button>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th class="col-drag">拖曳</th>
                <th class="col-seq">編號</th>
                <th>工作項目說明</th>
                <th class="col-check">查驗停留點<br><span style="color:#2563eb;">(★ 菱形)</span></th>
                <th class="col-check">安衛查驗點<br><span style="color:#dc2626;">(※ 標註)</span></th>
                ${enablePhases ? '<th class="col-phase">所屬階段</th>' : ''}
                <th class="col-break">換欄斷點</th>
                <th class="col-action">刪除</th>
              </tr>
            </thead>
            <tbody id="tbody_${grp.key}" data-phase="${grp.key}">
            </tbody>
          </table>
        </div>
      `;

      container.appendChild(secDiv);
      const tbody = secDiv.querySelector(`#tbody_${grp.key}`);

      tbody.addEventListener('dragover', handleTableDragOver);
      tbody.addEventListener('dragleave', handleTableDragLeave);
      tbody.addEventListener('drop', handleTableDrop);

      if (itemsInGroup.length === 0) {
        const emptyTr = document.createElement('tr');
        emptyTr.innerHTML = `<td colspan="${enablePhases ? 8 : 7}" style="text-align:center; color:#94a3b8; padding:12px; font-size:0.85rem;">目前無項目，可從其他階段拖曳至此或點擊右上角新增</td>`;
        tbody.appendChild(emptyTr);
      } else {
        itemsInGroup.forEach((item) => {
          const globalIndex = sorted.indexOf(item);
          const isBreak = (splitAfterIndex === globalIndex);

          const tr = document.createElement('tr');
          tr.dataset.id = String(item.id);

          tr.innerHTML = `
            <td class="col-drag"><span class="drag-handle" title="按住圖示拖曳調序">☰</span></td>
            <td class="col-seq">${globalIndex + 1}</td>
            <td>
              <input type="text" value="${escapeHtml(item.text)}" oninput="updateItemText('${item.id}', this.value)">
            </td>
            <td class="col-check">
              <input type="checkbox" ${item.isStopPoint ? 'checked' : ''} onchange="toggleStopPoint('${item.id}', this.checked)">
            </td>
            <td class="col-check">
              <input type="checkbox" ${item.isSafetyPoint ? 'checked' : ''} onchange="toggleSafetyPoint('${item.id}', this.checked)">
            </td>
            ${enablePhases ? `
              <td class="col-phase">
                <select class="phase-select" onchange="updateItemPhase('${item.id}', this.value)">
                  <option value="pre" ${item.phase === 'pre' ? 'selected' : ''}>施工前</option>
                  <option value="mid" ${(item.phase === 'mid' || !item.phase) ? 'selected' : ''}>施工中</option>
                  <option value="post" ${item.phase === 'post' ? 'selected' : ''}>施工後</option>
                </select>
              </td>
            ` : ''}
            <td class="col-break">
              <button class="btn-break ${isBreak ? 'active' : ''}" onclick="toggleBreakPoint(${globalIndex})">
                ${isBreak ? '⮐ 斷點於此' : '⮐ 設為斷點'}
              </button>
            </td>
            <td class="col-action">
              <button class="btn-icon btn-delete" onclick="deleteItem('${item.id}')" title="刪除此項目">✕</button>
            </td>
          `;

          const handle = tr.querySelector('.drag-handle');
          handle.addEventListener('mousedown', () => tr.setAttribute('draggable', 'true'));
          handle.addEventListener('mouseup', () => tr.removeAttribute('draggable'));

          tr.addEventListener('dragstart', handleDragStart);
          tr.addEventListener('dragover', handleRowDragOver);
          tr.addEventListener('dragleave', handleRowDragLeave);
          tr.addEventListener('end', handleDragEnd);

          tbody.appendChild(tr);
        });
      }
    });

    const subTitle = document.getElementById('previewSubTitle');
    if (isDualColActive) {
      subTitle.textContent = `雙欄排版 (於第 ${splitAfterIndex + 1} 步圓形接續換欄)`;
    } else if (enablePhases) {
      subTitle.textContent = '施工階段管制模式 (施工前/中/後)';
    } else {
      subTitle.textContent = '標準單欄排版';
    }
  }

  function handleDragStart(e) {
    if (this.getAttribute('draggable') !== 'true') { e.preventDefault(); return; }
    draggedItemId = String(this.dataset.id);
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', draggedItemId);
  }

  function handleRowDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (!this.dataset.id || String(this.dataset.id) === draggedItemId) return;

    const rect = this.getBoundingClientRect();
    const relY = e.clientY - rect.top;

    if (relY > rect.height / 2) {
      this.classList.remove('drag-over-top');
      this.classList.add('drag-over-bottom');
    } else {
      this.classList.remove('drag-over-bottom');
      this.classList.add('drag-over-top');
    }
  }

  function handleRowDragLeave() {
    this.classList.remove('drag-over-top', 'drag-over-bottom');
  }

  function handleTableDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    this.classList.add('tbody-drag-over');
  }

  function handleTableDragLeave(e) {
    if (!this.contains(e.relatedTarget)) {
      this.classList.remove('tbody-drag-over');
    }
  }

  function handleTableDrop(e) {
    e.preventDefault();
    this.classList.remove('tbody-drag-over');
    document.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over-top', 'drag-over-bottom'));

    if (!draggedItemId) return;

    const targetPhase = this.dataset.phase;
    const fromIdx = flowData.findIndex(d => String(d.id) === String(draggedItemId));
    if (fromIdx === -1) return;

    const movedItem = flowData.splice(fromIdx, 1)[0];

    if (enablePhases && targetPhase && targetPhase !== 'all') {
      movedItem.phase = targetPhase;
    }

    const targetRow = e.target.closest('tr[data-id]');
    if (targetRow && targetRow.dataset.id) {
      const targetId = String(targetRow.dataset.id);
      const targetIdx = flowData.findIndex(d => String(d.id) === targetId);
      if (targetIdx !== -1) {
        const rect = targetRow.getBoundingClientRect();
        const isBottom = (e.clientY - rect.top) > (rect.height / 2);
        const insertIdx = isBottom ? targetIdx + 1 : targetIdx;
        flowData.splice(insertIdx, 0, movedItem);
      } else {
        flowData.push(movedItem);
      }
    } else {
      if (enablePhases && targetPhase && targetPhase !== 'all') {
        let lastIdx = -1;
        for (let i = flowData.length - 1; i >= 0; i--) {
          if ((flowData[i].phase || 'mid') === targetPhase) {
            lastIdx = i;
            break;
          }
        }
        if (lastIdx !== -1) {
          flowData.splice(lastIdx + 1, 0, movedItem);
        } else {
          const order = { 'pre': 1, 'mid': 2, 'post': 3 };
          const targetWeight = order[targetPhase] || 2;
          let insertAt = flowData.length;
          for (let i = 0; i < flowData.length; i++) {
            const w = order[flowData[i].phase || 'mid'] || 2;
            if (w > targetWeight) {
              insertAt = i;
              break;
            }
          }
          flowData.splice(insertAt, 0, movedItem);
        }
      } else {
        flowData.push(movedItem);
      }
    }

    renderSections();
    updateDiagram();
  }

  function handleDragEnd() {
    this.removeAttribute('draggable');
    this.classList.remove('dragging');
    document.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over-top', 'drag-over-bottom'));
    document.querySelectorAll('tbody').forEach(b => b.classList.remove('tbody-drag-over'));
    draggedItemId = null;
  }

  function updateItemText(id, val) {
    const item = flowData.find(d => String(d.id) === String(id));
    if (item) { item.text = val; updateDiagram(); }
  }
  function toggleStopPoint(id, checked) {
    const item = flowData.find(d => String(d.id) === String(id));
    if (item) { item.isStopPoint = checked; updateDiagram(); }
  }
  function toggleSafetyPoint(id, checked) {
    const item = flowData.find(d => String(d.id) === String(id));
    if (item) { item.isSafetyPoint = checked; updateDiagram(); }
  }
  function updateItemPhase(id, newPhase) {
    const item = flowData.find(d => String(d.id) === String(id));
    if (item) {
      item.phase = newPhase;
      renderSections();
      updateDiagram();
    }
  }

  function toggleBreakPoint(globalIndex) {
    if (splitAfterIndex === globalIndex) {
      splitAfterIndex = null;
    } else {
      splitAfterIndex = globalIndex;
      enablePhases = false;
    }
    renderSections();
    updateDiagram();
  }

  function addNewRow(targetPhase = 'mid') {
    flowData.push({
      id: Date.now(),
      text: "新作業項目",
      isStopPoint: false,
      isSafetyPoint: false,
      phase: targetPhase
    });
    renderSections();
    updateDiagram();
  }

  function deleteItem(id) {
    if (flowData.length <= 1) { alert("流程圖至少需保留一個作業項目！"); return; }
    flowData = flowData.filter(d => String(d.id) !== String(id));
    if (splitAfterIndex !== null && splitAfterIndex >= flowData.length - 1) splitAfterIndex = null;
    renderSections();
    updateDiagram();
  }

  function parseAndApplyPastedText(rawText, rawHtml = '') {
    let rawItems = [];
    if (rawHtml && (rawHtml.includes('<table') || rawHtml.includes('<td'))) {
      const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
      doc.querySelectorAll('td, th').forEach(c => {
        let t = c.innerText.trim();
        if (t) rawItems.push(t);
      });
    }
    if (rawItems.length === 0 && rawText) {
      rawItems = rawText.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);
    }
    rawItems = rawItems.filter(item => item !== '施工流程' && item !== '管理項目(A)');
    if (rawItems.length === 0) return false;

    const newTasks = [];
    const baseId = Date.now();
    rawItems.forEach((item, idx) => {
      let cleanItem = item.replace(/\s+/g, ' ').trim();
      if (['開始', '完成', '結案', '完工'].includes(cleanItem)) return;
      let isSafety = false;
      if (cleanItem.includes('※')) { isSafety = true; cleanItem = cleanItem.replace(/※/g, '').trim(); }
      let isStop = false;
      if (cleanItem.includes('★')) { isStop = true; cleanItem = cleanItem.replace(/★/g, '').trim(); }

      newTasks.push({
        id: baseId + idx + 1,
        text: cleanItem,
        isStopPoint: isStop,
        isSafetyPoint: isSafety,
        phase: 'mid'
      });
    });

    if (newTasks.length > 0) {
      flowData = newTasks;
      splitAfterIndex = null;
      renderSections();
      updateDiagram();
      showToast(`成功匯入 ${newTasks.length} 個工項！已全數預設為「施工中」，可自由拖曳調整階段。`);
      return true;
    }
    return false;
  }

  function bindGlobalPaste() {
    window.addEventListener('paste', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      const cd = e.clipboardData || window.clipboardData;
      const text = cd.getData('text/plain');
      const html = cd.getData('text/html');
      if (text || html) {
        if (parseAndApplyPastedText(text, html)) e.preventDefault();
      }
    });
  }

  function openPasteModal() {
    document.getElementById('pasteModal').style.display = 'flex';
    const a = document.getElementById('modalPasteInput');
    a.value = '';
    a.focus();
  }
  function closePasteModal() { document.getElementById('pasteModal').style.display = 'none'; }
  function confirmModalPaste() {
    const a = document.getElementById('modalPasteInput');
    if (!a.value.trim()) return;
    parseAndApplyPastedText(a.value);
    closePasteModal();
  }

  function getFormsData() {
    const blueRaw = document.getElementById('blueFormsInput') ? document.getElementById('blueFormsInput').value : '';
    const redRaw = document.getElementById('redFormsInput') ? document.getElementById('redFormsInput').value : '';
    const blueList = blueRaw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    const redList = redRaw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    return { blueList, redList, hasForms: (blueList.length > 0 || redList.length > 0) };
  }

  // --- 幾何計算模型 ---
  function buildGeometryModel() {
    const sorted = getSortedFlowData();
    const isDoubleCol = (splitAfterIndex !== null && splitAfterIndex >= 0 && splitAfterIndex < sorted.length - 1);
    const renderPhases = (enablePhases && !isDoubleCol);

    let startW = Math.round(nodeWidth * 0.8);
    if (startW % 2 !== 0) startW += 1;

    let diaW = Math.round(nodeWidth * 0.94);
    if (diaW % 2 !== 0) diaW += 1;

    let diaH = Math.round(nodeHeight * 1.15);
    if (diaH % 2 !== 0) diaH += 1;

    const lineH = Math.round(fontSizePt * 1.4);
    const lineSpacingWord = Math.round(fontSizePt * 1.25);

    const nodes = [];
    const arrows = [];
    const loopbacks = [];
    const phaseDividers = [];
    const phaseLabels = [];

    if (!isDoubleCol) {
      // ===== 單欄排版 (拉大虛線與流程圖距離，杜絕擠壓卡住) =====
      const V_LINE_X = 40;       // 左側垂直灰色虛線位置
      const PHASE_TEXT_X = 18;   // 階段直排文字位置
      const LOOP_X = renderPhases ? 86 : 48; // 不合格回溯線位置 (與虛線保持充足間距)
      const CX = renderPhases 
        ? (LOOP_X + 28 + Math.round(nodeWidth / 2)) 
        : Math.round(48 + 24 + nodeWidth / 2);
      const FORMS_X = CX + Math.round(nodeWidth / 2) + 26;

      let currentY = 24;

      // 開始圖塊高度卡死 45pt
      const startNode = {
        type: 'start',
        lines: [startNodeText],
        x: Math.round(CX - startW / 2),
        y: currentY,
        w: startW,
        h: START_END_HEIGHT
      };
      nodes.push(startNode);
      currentY += START_END_HEIGHT;

      let prevAnchor = { x: CX, y: currentY };
      let pendingPass = false;
      let firstTaskAnchorY = null;

      const phaseBounds = {
        'pre': { minY: 9999, maxY: -9999, has: false },
        'mid': { minY: 9999, maxY: -9999, has: false },
        'post': { minY: 9999, maxY: -9999, has: false }
      };

      sorted.forEach((item, idx) => {
        const ph = item.phase || 'mid';
        phaseBounds[ph].has = true;

        const currentArrowGap = pendingPass ? PASS_VERTICAL_GAP : verticalGap;
        currentY += currentArrowGap;

        if (idx === 0) firstTaskAnchorY = currentY;

        arrows.push({
          x1: prevAnchor.x, y1: prevAnchor.y, x2: CX, y2: currentY, hasPass: pendingPass
        });

        if (renderPhases && idx > 0) {
          const prevPh = sorted[idx - 1].phase || 'mid';
          if (prevPh !== ph) {
            const divY = Math.round((prevAnchor.y + currentY) / 2);
            phaseDividers.push({
              y: divY,
              x1: 10,
              x2: CX + nodeWidth / 2 + 25
            });
          }
        }
        pendingPass = false;

        const lines = formatNodeLines(item.text);
        let h = Math.max(nodeHeight, Math.round(nodeHeight * 0.5) + lines.length * lineH);
        if (h % 2 !== 0) h += 1;

        const taskNode = {
          type: 'task',
          lines: lines,
          isSafety: item.isSafetyPoint,
          x: Math.round(CX - nodeWidth / 2),
          y: currentY,
          w: nodeWidth,
          h: h,
          leftAnchor: { x: Math.round(CX - nodeWidth / 2), y: Math.round(currentY + h / 2) }
        };
        nodes.push(taskNode);

        phaseBounds[ph].minY = Math.min(phaseBounds[ph].minY, currentY);
        currentY += h;
        phaseBounds[ph].maxY = Math.max(phaseBounds[ph].maxY, currentY);
        prevAnchor = { x: CX, y: currentY };

        if (item.isStopPoint) {
          currentY += verticalGap;
          arrows.push({ x1: prevAnchor.x, y1: prevAnchor.y, x2: CX, y2: currentY, hasPass: false });

          const diamondNode = {
            type: 'diamond',
            x: Math.round(CX - diaW / 2),
            y: currentY,
            w: diaW,
            h: diaH,
            leftTip: { x: Math.round(CX - diaW / 2), y: Math.round(currentY + diaH / 2) }
          };
          nodes.push(diamondNode);

          loopbacks.push({
            from: diamondNode.leftTip,
            to: taskNode.leftAnchor,
            loopX: LOOP_X
          });

          currentY += diaH;
          phaseBounds[ph].maxY = Math.max(phaseBounds[ph].maxY, currentY);
          prevAnchor = { x: CX, y: currentY };
          pendingPass = true;
        }
      });

      const finalArrowGap = pendingPass ? PASS_VERTICAL_GAP : verticalGap;
      currentY += finalArrowGap;
      arrows.push({ x1: prevAnchor.x, y1: prevAnchor.y, x2: CX, y2: currentY, hasPass: pendingPass });

      // 完成圖塊高度卡死 45pt
      const endNode = {
        type: 'end',
        lines: [endNodeText],
        x: Math.round(CX - startW / 2),
        y: currentY,
        w: startW,
        h: START_END_HEIGHT
      };
      nodes.push(endNode);
      currentY += START_END_HEIGHT;

      if (renderPhases) {
        const stageConfigs = [
          { key: 'pre', text: '施工前' },
          { key: 'mid', text: '施工中' },
          { key: 'post', text: '施工後' }
        ];

        stageConfigs.forEach(stg => {
          const b = phaseBounds[stg.key];
          if (b.has && b.minY < 9000) {
            const centerY = Math.round((b.minY + b.maxY) / 2);
            phaseLabels.push({
              text: stg.text,
              x: PHASE_TEXT_X,
              y: centerY
            });
          }
        });
      }

      const formsY = firstTaskAnchorY ? (firstTaskAnchorY + 10) : Math.round(currentY * 0.35);
      const totalH = Math.max(currentY + 24, formsY + 220);
      const canvasW = Math.max(560, FORMS_X + 240);

      return {
        isDoubleCol: false,
        renderPhases,
        nodes, arrows, loopbacks,
        phaseDividers, phaseLabels,
        verticalLine: renderPhases ? { x: V_LINE_X, y1: 15, y2: currentY + 6 } : null,
        canvasWidth: canvasW,
        totalHeight: totalH,
        formsY: formsY,
        formsX: FORMS_X,
        formsWidth: 260,
        lineH,
        lineSpacingWord
      };

    } else {
      // ===== 雙欄換欄排版 =====
      const CX1 = Math.round(35 + nodeWidth / 2);
      const CX2 = Math.round(CX1 + nodeWidth + 60);
      const LOOP_X1 = CX1 - Math.round(nodeWidth / 2) - 20;
      const LOOP_X2 = CX2 - Math.round(nodeWidth / 2) - 20;

      let y1 = 24;
      const startNode = {
        type: 'start',
        lines: [startNodeText],
        x: Math.round(CX1 - startW / 2),
        y: y1,
        w: startW,
        h: START_END_HEIGHT
      };
      nodes.push(startNode);
      y1 += START_END_HEIGHT;

      let prevAnchor1 = { x: CX1, y: y1 };
      let pendingPass1 = false;

      for (let i = 0; i <= splitAfterIndex; i++) {
        const item = sorted[i];
        const currentArrowGap = pendingPass1 ? PASS_VERTICAL_GAP : verticalGap;
        y1 += currentArrowGap;

        arrows.push({ x1: prevAnchor1.x, y1: prevAnchor1.y, x2: CX1, y2: y1, hasPass: pendingPass1 });
        pendingPass1 = false;

        const lines = formatNodeLines(item.text);
        let h = Math.max(nodeHeight, Math.round(nodeHeight * 0.5) + lines.length * lineH);
        if (h % 2 !== 0) h += 1;

        const taskNode = {
          type: 'task',
          lines: lines,
          isSafety: item.isSafetyPoint,
          x: Math.round(CX1 - nodeWidth / 2),
          y: y1,
          w: nodeWidth,
          h: h,
          leftAnchor: { x: Math.round(CX1 - nodeWidth / 2), y: Math.round(y1 + h / 2) }
        };
        nodes.push(taskNode);
        y1 += h;
        prevAnchor1 = { x: CX1, y: y1 };

        if (item.isStopPoint) {
          y1 += verticalGap;
          arrows.push({ x1: prevAnchor1.x, y1: prevAnchor1.y, x2: CX1, y2: y1, hasPass: false });

          const diamondNode = {
            type: 'diamond',
            x: Math.round(CX1 - diaW / 2),
            y: y1,
            w: diaW,
            h: diaH,
            leftTip: { x: Math.round(CX1 - diaW / 2), y: Math.round(y1 + diaH / 2) }
          };
          nodes.push(diamondNode);

          loopbacks.push({
            from: diamondNode.leftTip,
            to: taskNode.leftAnchor,
            loopX: LOOP_X1
          });

          y1 += diaH;
          prevAnchor1 = { x: CX1, y: y1 };
          pendingPass1 = true;
        }
      }

      // 左欄末端：正圓形連接點 (縮小 1/4)
      const outArrowGap = pendingPass1 ? PASS_VERTICAL_GAP : verticalGap;
      y1 += outArrowGap;
      arrows.push({ x1: prevAnchor1.x, y1: prevAnchor1.y, x2: CX1, y2: y1, hasPass: pendingPass1 });

      const circleOutNode = {
        type: 'circle',
        cx: CX1,
        cy: y1 + CIRCLE_RADIUS,
        r: CIRCLE_RADIUS
      };
      nodes.push(circleOutNode);
      y1 += CIRCLE_RADIUS * 2;

      // 右欄頂部：正圓形連接點 (縮小 1/4)
      const circleInTopY = 32;
      const circleInNode = {
        type: 'circle',
        cx: CX2,
        cy: circleInTopY + CIRCLE_RADIUS,
        r: CIRCLE_RADIUS
      };
      nodes.push(circleInNode);

      let y2 = circleInTopY + CIRCLE_RADIUS * 2;
      let prevAnchor2 = { x: CX2, y: y2 };
      let pendingPass2 = false;

      for (let i = splitAfterIndex + 1; i < sorted.length; i++) {
        const item = sorted[i];
        const currentArrowGap = pendingPass2 ? PASS_VERTICAL_GAP : verticalGap;
        y2 += currentArrowGap;

        arrows.push({ x1: prevAnchor2.x, y1: prevAnchor2.y, x2: CX2, y2: y2, hasPass: pendingPass2 });
        pendingPass2 = false;

        const lines = formatNodeLines(item.text);
        let h = Math.max(nodeHeight, Math.round(nodeHeight * 0.5) + lines.length * lineH);
        if (h % 2 !== 0) h += 1;

        const taskNode = {
          type: 'task',
          lines: lines,
          isSafety: item.isSafetyPoint,
          x: Math.round(CX2 - nodeWidth / 2),
          y: y2,
          w: nodeWidth,
          h: h,
          leftAnchor: { x: Math.round(CX2 - nodeWidth / 2), y: Math.round(y2 + h / 2) }
        };
        nodes.push(taskNode);
        y2 += h;
        prevAnchor2 = { x: CX2, y: y2 };

        if (item.isStopPoint) {
          y2 += verticalGap;
          arrows.push({ x1: prevAnchor2.x, y1: prevAnchor2.y, x2: CX2, y2: y2, hasPass: false });

          const diamondNode = {
            type: 'diamond',
            x: Math.round(CX2 - diaW / 2),
            y: y2,
            w: diaW,
            h: diaH,
            leftTip: { x: Math.round(CX2 - diaW / 2), y: Math.round(y2 + diaH / 2) }
          };
          nodes.push(diamondNode);

          loopbacks.push({
            from: diamondNode.leftTip,
            to: taskNode.leftAnchor,
            loopX: LOOP_X2
          });

          y2 += diaH;
          prevAnchor2 = { x: CX2, y: y2 };
          pendingPass2 = true;
        }
      }

      const endArrowGap = pendingPass2 ? PASS_VERTICAL_GAP : verticalGap;
      y2 += endArrowGap;
      arrows.push({ x1: prevAnchor2.x, y1: prevAnchor2.y, x2: CX2, y2: y2, hasPass: pendingPass2 });

      const endNode = {
        type: 'end',
        lines: [endNodeText],
        x: Math.round(CX2 - startW / 2),
        y: y2,
        w: startW,
        h: START_END_HEIGHT
      };
      nodes.push(endNode);
      y2 += START_END_HEIGHT;

      const maxColY = Math.max(y1, y2);
      const formsY = maxColY + 24;
      const totalH = formsY + 70;
      const canvasW = Math.max(520, CX2 + Math.round(nodeWidth / 2) + 30);

      return {
        isDoubleCol: true,
        renderPhases: false,
        nodes, arrows, loopbacks,
        phaseDividers: [], phaseLabels: [], verticalLine: null,
        canvasWidth: canvasW,
        totalHeight: totalH,
        formsY: formsY,
        formsX: 35,
        formsWidth: canvasW - 70,
        lineH,
        lineSpacingWord
      };
    }
  }

  // --- SVG 即時預覽渲染 ---
  function updateDiagram() {
    const geo = buildGeometryModel();
    const forms = getFormsData();
    const svg = document.getElementById('svgPreview');
    svg.setAttribute('width', geo.canvasWidth);
    svg.setAttribute('height', geo.totalHeight);

    let content = `
      <defs>
        <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
          <polygon points="0 0, 7 3.5, 0 7" fill="#000000" />
        </marker>
      </defs>
    `;

    if (geo.verticalLine) {
      content += `<line x1="${geo.verticalLine.x}" y1="${geo.verticalLine.y1}" x2="${geo.verticalLine.x}" y2="${geo.verticalLine.y2}" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,4" />`;
    }

    geo.phaseDividers.forEach(d => {
      content += `<line x1="${d.x1}" y1="${d.y}" x2="${d.x2}" y2="${d.y}" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,4" />`;
    });

    geo.phaseLabels.forEach(p => {
      const chars = p.text.split('');
      const charGap = fontSizePt * 1.5;
      const startY = p.y - ((chars.length - 1) * charGap) / 2;
      chars.forEach((c, i) => {
        content += `<text x="${p.x}" y="${startY + i * charGap}" font-size="${fontSizePt + 3}" font-weight="bold" fill="#000000" font-family="'標楷體', 'DFKai-SB', serif" text-anchor="middle">${c}</text>`;
      });
    });

    geo.arrows.forEach(a => {
      content += `<line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />`;
      if (a.hasPass) {
        const midY = Math.round((a.y1 + a.y2) / 2);
        content += `<text x="${a.x1 + 8}" y="${midY + 4}" font-size="${fontSizePt + 3}" font-weight="bold" fill="#000000" font-family="'標楷體', 'DFKai-SB', serif" text-anchor="start">合格</text>`;
      }
    });

    geo.loopbacks.forEach(l => {
      const midY = Math.round((l.from.y + l.to.y) / 2);
      content += `
        <path d="M ${l.from.x} ${l.from.y} L ${l.loopX} ${l.from.y} L ${l.loopX} ${l.to.y} L ${l.to.x} ${l.to.y}" 
              fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
        <text x="${l.loopX - 12}" y="${midY - 14}" font-size="${fontSizePt + 3}" font-weight="bold" fill="#000000" font-family="'標楷體', 'DFKai-SB', serif" text-anchor="middle">不</text>
        <text x="${l.loopX - 12}" y="${midY + 1}" font-size="${fontSizePt + 3}" font-weight="bold" fill="#000000" font-family="'標楷體', 'DFKai-SB', serif" text-anchor="middle">合</text>
        <text x="${l.loopX - 12}" y="${midY + 16}" font-size="${fontSizePt + 3}" font-weight="bold" fill="#000000" font-family="'標楷體', 'DFKai-SB', serif" text-anchor="middle">格</text>
      `;
    });

    geo.nodes.forEach(n => {
      if (n.type === 'start' || n.type === 'end') {
        content += `
          <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${Math.round(n.h/2)}" ry="${Math.round(n.h/2)}" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" />
          <text x="${Math.round(n.x + n.w/2)}" y="${n.y + n.h/2 + fontSizePt * 0.35}" font-size="${fontSizePt + 3}" font-weight="bold" fill="#000000" font-family="'標楷體', 'DFKai-SB', serif" text-anchor="middle">
            ${escapeHtml(n.lines[0])}
          </text>
        `;
      } else if (n.type === 'circle') {
        content += `
          <circle cx="${n.cx}" cy="${n.cy}" r="${n.r}" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" />
        `;
      } else if (n.type === 'task') {
        const totalTextH = (n.lines.length - 1) * geo.lineH;
        const startY = Math.round(n.y + n.h / 2 - totalTextH / 2 + fontSizePt * 0.35);
        content += `
          <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" />
          <text font-size="${fontSizePt + 3}" font-weight="bold" fill="#000000" font-family="'標楷體', 'DFKai-SB', serif" text-anchor="middle">
            ${n.lines.map((l, i) => {
              const prefix = (i === 0 && n.isSafety) ? '<tspan fill="#DC2626" font-weight="bold">※ </tspan>' : '';
              return `<tspan x="${Math.round(n.x + n.w/2)}" y="${startY + i * geo.lineH}">${prefix}${escapeHtml(l)}</tspan>`;
            }).join('')}
          </text>
        `;
      } else if (n.type === 'diamond') {
        const pts = `${Math.round(n.x + n.w/2)},${n.y} ${Math.round(n.x + n.w)},${Math.round(n.y + n.h/2)} ${Math.round(n.x + n.w/2)},${Math.round(n.y + n.h)} ${n.x},${Math.round(n.y + n.h/2)}`;
        content += `
          <polygon points="${pts}" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" />
          <text x="${Math.round(n.x + n.w/2)}" y="${Math.round(n.y + n.h/2 + fontSizePt * 0.35)}" font-size="${fontSizePt + 3}" font-weight="bold" fill="#000000" font-family="'標楷體', 'DFKai-SB', serif" text-anchor="middle">
            <tspan fill="#0033CC">★</tspan> 查驗
          </text>
        `;
      }
    });

    if (forms.hasForms) {
      let curFormY = geo.formsY;
      content += `<text x="${geo.formsX}" y="${curFormY}" font-size="${fontSizePt + 3}" font-weight="bold" fill="#000000" font-family="'標楷體', 'DFKai-SB', serif">使用表單：</text>`;
      curFormY += Math.round(fontSizePt * 1.6);

      forms.blueList.forEach(line => {
        content += `<text x="${geo.formsX}" y="${curFormY}" font-size="${fontSizePt + 3}" font-weight="bold" fill="#0033CC" font-family="'標楷體', 'DFKai-SB', serif">${escapeHtml(line)}</text>`;
        curFormY += Math.round(fontSizePt * 1.5);
      });
      curFormY += 4;

      forms.redList.forEach(line => {
        content += `<text x="${geo.formsX}" y="${curFormY}" font-size="${fontSizePt + 3}" font-weight="bold" fill="#CC0000" font-family="'標楷體', 'DFKai-SB', serif">${escapeHtml(line)}</text>`;
        curFormY += Math.round(fontSizePt * 1.5);
      });
    }

    svg.innerHTML = content;
  }

  // --- Word 原生 VML 代碼生成 ---
  function buildWordVmlHtml() {
    const geo = buildGeometryModel();
    const forms = getFormsData();
    let vml = '';

    if (geo.verticalLine) {
      vml += `
        <v:line from="${geo.verticalLine.x}pt,${geo.verticalLine.y1}pt" to="${geo.verticalLine.x}pt,${geo.verticalLine.y2}pt" 
                style="position:absolute;" strokecolor="#888888" strokeweight="1pt">
          <v:stroke dashstyle="dash"></v:stroke>
        </v:line>
      `;
    }

    geo.phaseDividers.forEach(d => {
      vml += `
        <v:line from="${d.x1}pt,${d.y}pt" to="${d.x2}pt,${d.y}pt" 
                style="position:absolute;" strokecolor="#888888" strokeweight="1pt">
          <v:stroke dashstyle="dash"></v:stroke>
        </v:line>
      `;
    });

    geo.phaseLabels.forEach(p => {
      const textHtml = p.text.split('').join('<br/>');
      vml += `
        <v:rect style="position:absolute;left:${p.x - 10}pt;top:${p.y - 24}pt;width:20pt;height:48pt;v-text-anchor:middle;" filled="f" stroked="f">
          <v:textbox inset="0,0,0,0" style="v-text-anchor:middle;">
            <p align="center" style="margin:0;padding:0;text-align:center;font-family:'標楷體','DFKai-SB';font-size:${fontSizePt}pt;font-weight:bold;color:#000000;mso-line-height-rule:exactly;line-height:${geo.lineSpacingWord}pt;">
              ${textHtml}
            </p>
          </v:textbox>
        </v:rect>
      `;
    });

    geo.arrows.forEach(a => {
      vml += `
        <v:line from="${Math.round(a.x1)}pt,${Math.round(a.y1)}pt" to="${Math.round(a.x2)}pt,${Math.round(a.y2)}pt" 
                style="position:absolute;" strokecolor="#000000" strokeweight="1.2pt" o:connectortype="straight">
          <v:stroke endarrow="classic"></v:stroke>
        </v:line>
      `;

      if (a.hasPass) {
        const midY = Math.round((a.y1 + a.y2) / 2);
        vml += `
          <v:rect style="position:absolute;left:${Math.round(a.x1 + 6)}pt;top:${midY - 7}pt;width:34pt;height:16pt;v-text-anchor:middle;" filled="f" stroked="f">
            <v:textbox inset="0,0,0,0" style="v-text-anchor:middle;">
              <p align="left" style="margin:0;padding:0;text-align:left;font-family:'標楷體','DFKai-SB';font-size:${fontSizePt}pt;font-weight:bold;color:#000000;mso-line-height-rule:exactly;line-height:${geo.lineSpacingWord}pt;">
                合格
              </p>
            </v:textbox>
          </v:rect>
        `;
      }
    });

    geo.loopbacks.forEach(l => {
      const midY = Math.round((l.from.y + l.to.y) / 2);
      const p1 = `${Math.round(l.from.x)}pt,${Math.round(l.from.y)}pt`;
      const p2 = `${Math.round(l.loopX)}pt,${Math.round(l.from.y)}pt`;
      const p3 = `${Math.round(l.loopX)}pt,${Math.round(l.to.y)}pt`;
      const p4 = `${Math.round(l.to.x)}pt,${Math.round(l.to.y)}pt`;

      vml += `
        <v:polyline points="${p1} ${p2} ${p3} ${p4}" style="position:absolute;" strokecolor="#000000" strokeweight="1.2pt" o:connectortype="elbow">
          <v:stroke endarrow="classic"></v:stroke>
        </v:polyline>
        <v:rect style="position:absolute;left:${Math.round(l.loopX - 22)}pt;top:${midY - 24}pt;width:20pt;height:48pt;v-text-anchor:middle;" filled="f" stroked="f">
          <v:textbox inset="0,0,0,0" style="v-text-anchor:middle;">
            <p align="center" style="margin:0;padding:0;text-align:center;font-family:'標楷體','DFKai-SB';font-size:${fontSizePt}pt;font-weight:bold;color:#000000;mso-line-height-rule:exactly;line-height:${geo.lineSpacingWord}pt;">
              不<br/>合<br/>格
            </p>
          </v:textbox>
        </v:rect>
      `;
    });

    geo.nodes.forEach(n => {
      if (n.type === 'start' || n.type === 'end') {
        const nx = Math.round(n.x);
        const ny = Math.round(n.y);
        const nw = Math.round(n.w);
        const nh = Math.round(n.h);

        vml += `
          <v:roundrect style="position:absolute;left:${nx}pt;top:${ny}pt;width:${nw}pt;height:${nh}pt;v-text-anchor:middle;" 
                       arcsize="0.5" fillcolor="#FFFFFF" strokecolor="#000000" strokeweight="1.2pt">
            <v:textbox inset="2pt,2pt,2pt,2pt" style="v-text-anchor:middle;mso-fit-shape-to-text:f;">
              <p align="center" style="margin:0;padding:0;text-align:center;font-family:'標楷體','DFKai-SB';font-size:${fontSizePt}pt;font-weight:bold;color:#000000;mso-line-height-rule:exactly;line-height:${geo.lineSpacingWord}pt;">
                ${escapeHtml(n.lines[0])}
              </p>
            </v:textbox>
          </v:roundrect>
        `;
      } else if (n.type === 'circle') {
        const left = Math.round(n.cx - n.r);
        const top = Math.round(n.cy - n.r);
        const diam = Math.round(n.r * 2);
        vml += `
          <v:oval style="position:absolute;left:${left}pt;top:${top}pt;width:${diam}pt;height:${diam}pt;" 
                  fillcolor="#FFFFFF" strokecolor="#000000" strokeweight="1.2pt">
          </v:oval>
        `;
      } else if (n.type === 'task') {
        const nx = Math.round(n.x);
        const ny = Math.round(n.y);
        const nw = Math.round(n.w);
        const nh = Math.round(n.h);

        const prefix = n.isSafety ? `<span style="color:#CC0000;font-size:${fontSizePt}pt;">※</span> ` : '';
        const textHtml = prefix + n.lines.map(escapeHtml).join('<br/>');
        vml += `
          <v:rect style="position:absolute;left:${nx}pt;top:${ny}pt;width:${nw}pt;height:${nh}pt;v-text-anchor:middle;" 
                  fillcolor="#FFFFFF" stroke="#000000" strokeweight="1.2pt">
            <v:textbox inset="2pt,2pt,2pt,2pt" style="v-text-anchor:middle;mso-fit-shape-to-text:f;">
              <p align="center" style="margin:0;padding:0;text-align:center;font-family:'標楷體','DFKai-SB';font-size:${fontSizePt}pt;font-weight:bold;color:#000000;mso-line-height-rule:exactly;line-height:${geo.lineSpacingWord}pt;">
                ${textHtml}
              </p>
            </v:textbox>
          </v:rect>
        `;
      } else if (n.type === 'diamond') {
        const nx = Math.round(n.x);
        const ny = Math.round(n.y);
        const nw = Math.round(n.w);
        const nh = Math.round(n.h);
        const halfW = Math.round(nw / 2);
        const halfH = Math.round(nh / 2);

        vml += `
          <v:shape style="position:absolute;left:${nx}pt;top:${ny}pt;width:${nw}pt;height:${nh}pt;v-text-anchor:middle;" 
                   coordsize="${nw},${nh}" path="m ${halfW},0 l ${nw},${halfH}, ${halfW},${nh}, 0,${halfH} x e" 
                   fillcolor="#FFFFFF" strokecolor="#000000" strokeweight="1.2pt">
            <v:textbox inset="2pt,2pt,2pt,2pt" style="v-text-anchor:middle;mso-fit-shape-to-text:f;">
              <p align="center" style="margin:0;padding:0;text-align:center;font-family:'標楷體','DFKai-SB';font-size:${fontSizePt}pt;font-weight:bold;color:#000000;mso-line-height-rule:exactly;line-height:${geo.lineSpacingWord}pt;">
                <span style="color:#0033CC;font-size:${fontSizePt}pt;">★</span> 查驗
              </p>
            </v:textbox>
          </v:shape>
        `;
      }
    });

    if (forms.hasForms) {
      let formsInnerHtml = `<p style="margin:0 0 4pt 0;font-family:'標楷體','DFKai-SB';font-size:${fontSizePt}pt;font-weight:bold;color:#000000;mso-line-height-rule:exactly;line-height:${geo.lineSpacingWord}pt;">使用表單：</p>`;
      
      forms.blueList.forEach(line => {
        formsInnerHtml += `<p style="margin:0 0 3pt 0;font-family:'標楷體','DFKai-SB';font-size:${fontSizePt}pt;font-weight:bold;color:#0033CC;mso-line-height-rule:exactly;line-height:${geo.lineSpacingWord}pt;">${escapeHtml(line)}</p>`;
      });

      forms.redList.forEach(line => {
        formsInnerHtml += `<p style="margin:0 0 3pt 0;font-family:'標楷體','DFKai-SB';font-size:${fontSizePt}pt;font-weight:bold;color:#CC0000;mso-line-height-rule:exactly;line-height:${geo.lineSpacingWord}pt;">${escapeHtml(line)}</p>`;
      });

      const boxHeight = geo.isDoubleCol ? '60pt' : '200pt';
      vml += `
        <v:rect style="position:absolute;left:${geo.formsX}pt;top:${geo.formsY}pt;width:${geo.formsWidth}pt;height:${boxHeight};" filled="f" stroked="f">
          <v:textbox inset="0,0,0,0" style="mso-fit-shape-to-text:t;">
            ${formsInnerHtml}
          </v:textbox>
        </v:rect>
      `;
    }

    return `
      <html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
      <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <!--[if gte mso 9]>
        <xml><o:OfficeDocumentSettings><o:AllowPNG/><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
        <![endif]-->
        <style>
          v\\:* { behavior: url(#default#VML); display: inline-block; }
          p { margin: 0; padding: 0; }
        </style>
      </head>
      <body>
        <v:group style="position:relative;width:${geo.canvasWidth}pt;height:${geo.totalHeight}pt;" coordsize="${geo.canvasWidth},${geo.totalHeight}">
          ${vml}
        </v:group>
      </body>
      </html>
    `;
  }

  async function copyVmlToClipboard() {
    const htmlContent = buildWordVmlHtml();
    const sorted = getSortedFlowData();
    const plainText = sorted.map(d => d.text).join(' -> ');
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        const blobHtml = new Blob([htmlContent], { type: 'text/html' });
        const blobText = new Blob([plainText], { type: 'text/plain' });
        await navigator.clipboard.write([new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText })]);
      } else {
        const listener = (e) => {
          e.clipboardData.setData('text/html', htmlContent);
          e.clipboardData.setData('text/plain', plainText);
          e.preventDefault();
        };
        document.addEventListener('copy', listener);
        document.execCommand('copy');
        document.removeEventListener('copy', listener);
      }
      showToast('複製成功！請至 Word 按 Ctrl+V 貼上（已修復所有微調規格）');
    } catch (err) {
      console.error(err);
      showToast('寫入剪貼簿失敗，請確認瀏覽器已允許剪貼簿權限。', true);
    }
  }

  function downloadWordDoc() {
    const htmlContent = buildWordVmlHtml();
    const blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '標準施工流程圖.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('statusToast');
    t.textContent = msg;
    t.style.color = isError ? '#dc2626' : '#059669';
    setTimeout(() => { if (t.textContent === msg) t.textContent = ''; }, 4000);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>'"]/g, tag => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[tag] || tag));
  }
</script>
